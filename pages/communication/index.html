<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>开放交流 - 智能网联汽车信息安全实验室 (IVIS)</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/navigation.css">
    <style>
        /* 开放交流页面特定样式 */
        .event-card {
            background-color: var(--card-background);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .event-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }

        .event-card-content {
            padding: 1.5rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .event-meta {
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            color: #666;
        }

        .event-date {
            background-color: var(--primary-color);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            margin-right: 1rem;
            text-align: center;
            min-width: 80px;
        }

        .event-location {
            display: flex;
            align-items: center;
        }

        .event-location::before {
            content: '📍';
            margin-right: 0.5rem;
        }

        .event-card h3 {
            margin: 0.5rem 0;
            font-size: 1.5rem;
        }

        .event-description {
            margin-bottom: 1.5rem;
            flex-grow: 1;
        }

        .event-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .event-type {
            background-color: #f0f0f0;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        .upcoming-events,
        .past-events {
            margin-bottom: 4rem;
        }

        .tab-container {
            margin-bottom: 2rem;
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 2rem;
        }

        .tab {
            padding: 0.8rem 1.5rem;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            font-weight: 500;
            transition: all var(--transition-speed);
        }

        .tab.active {
            border-bottom-color: var(--primary-color);
            color: var(--primary-color);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* 网格布局 */
        .event-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
        }

        /* 地图容器 */
        .location-map-container {
            margin-top: 3rem;
            margin-bottom: 3rem;
        }

        .location-map {
            height: 450px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .map-info {
            margin-top: 1.5rem;
            padding: 1.5rem;
            background-color: var(--card-background);
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .map-info h3 {
            margin-bottom: 1rem;
            color: var(--primary-color);
        }

        .travel-info {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .travel-method {
            flex: 1;
            min-width: 200px;
        }

        .travel-method h4 {
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
        }

        .travel-method h4::before {
            content: '';
            display: inline-block;
            margin-right: 0.5rem;
            width: 24px;
            height: 24px;
            background-size: contain;
            background-repeat: no-repeat;
        }

        .travel-method.subway h4::before {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%230066cc"><path d="M12 2c-4.42 0-8 .5-8 4v10c0 .88.39 1.67 1 2.22V20c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h8v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4zm-2 3h4v2h-4V5zm6 11H8V9h8v7z"/></svg>');
        }

        .travel-method.bus h4::before {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%230066cc"><path d="M4 16c0 .88.39 1.67 1 2.22V20c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h8v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4s-8 .5-8 4v10zm3.5 1c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm1.5-6H6V6h12v5z"/></svg>');
        }

        .travel-method.car h4::before {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%230066cc"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg>');
        }

        /* 响应式调整 */
        @media (max-width: 768px) {
            .event-grid {
                grid-template-columns: 1fr;
            }
            
            .travel-info {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <!-- 页眉容器 - 将通过组件系统动态加载 -->
    <div id="header-container"></div>

    <main>
        <section class="hero">
            <div class="container">
                <h1>开放交流</h1>
                <p>了解我们的学术会议、讲座和开放日活动</p>
            </div>
        </section>

        <section class="events">
            <div class="container">
                <div class="tab-container">
                    <div class="tabs">
                        <div class="tab active" data-tab="upcoming">即将举行</div>
                        <div class="tab" data-tab="conferences">学术会议</div>
                        <div class="tab" data-tab="lectures">研讨讲座</div>
                        <div class="tab" data-tab="past">往期活动</div>
                        <div class="tab" data-tab="location">活动场地</div>
                    </div>

                    <div class="tab-content active" id="upcoming">
                        <h2>即将举行的活动</h2>
                        <div id="upcoming-content" class="event-grid">
                            <!-- 内容将通过配置文件动态加载 -->
                        </div>
                    </div>

                    <div class="tab-content" id="conferences">
                        <h2>学术会议</h2>
                        <div id="conferences-content" class="event-grid">
                            <!-- 内容将通过配置文件动态加载 -->
                        </div>
                    </div>

                    <div class="tab-content" id="lectures">
                        <h2>研讨讲座</h2>
                        <div id="lectures-content" class="event-grid">
                            <!-- 内容将通过配置文件动态加载 -->
                        </div>
                    </div>

                    <div class="tab-content" id="past">
                        <h2>往期活动</h2>
                        <div id="past-content" class="event-grid">
                            <!-- 内容将通过配置文件动态加载 -->
                        </div>
                    </div>

                    <div class="tab-content" id="location">
                        <h2>活动场地信息</h2>
                        <p>我们的学术活动主要在以下场地举行，欢迎前来参与交流。</p>
                        <div id="location-content">
                            <!-- 内容将通过配置文件动态加载 -->
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- 页脚容器 - 将通过组件系统动态加载 -->
    <div id="footer-container"></div>

    <!-- 加载组件系统 -->
    <script src="../../components/component-loader.js"></script>
    <script src="../../js/components.js"></script>
    <script src="../../js/config-manager.js"></script>
    <script src="../../js/content-renderer.js"></script>
    <script src="../../js/main.js"></script>
    <script>
        // 标签切换功能
        document.addEventListener('DOMContentLoaded', function () {
            const tabs = document.querySelectorAll('.tab');
            const tabContents = document.querySelectorAll('.tab-content');

            tabs.forEach(tab => {
                tab.addEventListener('click', function () {
                    // 移除所有标签的激活状态
                    tabs.forEach(t => t.classList.remove('active'));
                    // 激活当前点击的标签
                    this.classList.add('active');

                    // 隐藏所有内容区域
                    tabContents.forEach(content => content.classList.remove('active'));
                    // 显示对应的内容区域
                    const tabId = this.getAttribute('data-tab');
                    document.getElementById(tabId).classList.add('active');
                });
            });

            // 等待组件加载完成后再加载内容
            setTimeout(() => {
                initPageContent('communication');
            }, 100);
        });
    </script>
</body>

</html>
