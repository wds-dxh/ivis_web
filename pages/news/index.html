<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新闻中心 - 信息安全实验室 (ivis)</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/navigation.css">
    <link rel="stylesheet" href="../../css/modules.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <style>
        /* 新闻中心页面特定样式 */
        .publication-list {
            margin-bottom: 4rem;
        }
        
        .publication-year {
            font-size: 1.8rem;
            margin-bottom: 2rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--primary-color);
        }
        
        .publication-item {
            margin-bottom: 2rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
        }
        
        .publication-title {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        
        .publication-authors {
            margin-bottom: 0.5rem;
            color: #444;
        }
        
        .publication-journal {
            font-style: italic;
            margin-bottom: 0.5rem;
        }
        
        .publication-meta {
            display: flex;
            justify-content: space-between;
            color: #666;
            font-size: 0.9rem;
        }
        
        .publication-citations {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        
        .publication-citations::before {
            content: '📄';
        }
        
        .book-section {
            background-color: var(--card-background);
            padding: 2rem;
            border-radius: 8px;
            margin-bottom: 3rem;
        }
        
        .book-title {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <!-- 页眉容器 - 将通过组件系统动态加载 -->
    <div id="header-container"></div>

    <main>
        <section class="hero">
            <div class="container">
                <h1>新闻中心</h1>
                <p>了解我们的最新论文、专利和出版书籍</p>
            </div>
        </section>

        <section class="publications">
            <div class="container">
                <div id="news-container">
                    <!-- 内容将通过配置文件动态加载 -->
                </div>
            </div>
        </section>
    </main>

    <!-- 页脚容器 - 将通过组件系统动态加载 -->
    <div id="footer-container"></div>

    <!-- 加载组件系统 -->
    <script src="../../components/component-loader.js"></script>
    <script src="../../js/components.js"></script>
    <script src="../../js/config-manager.js"></script>
    <script src="../../js/content-renderer.js"></script>
    <script src="../../js/main.js"></script>
    
    <script>
        // 页面加载完成后初始化内容
        document.addEventListener('DOMContentLoaded', function() {
            // 等待组件加载完成后再加载内容
            setTimeout(() => {
                initPageContent('news');
            }, 100);
        });
    </script>
</body>
</html>
