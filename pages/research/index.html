<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科研动态 - 信息安全实验室 (ivis)</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/navigation.css">
    <style>
        .research-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }
        
        .research-card {
            background-color: var(--card-background);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        .research-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
        }
        
        .research-image {
            height: 200px;
            overflow: hidden;
            position: relative;
        }
        
        .research-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }
        
        .research-card:hover .research-image img {
            transform: scale(1.05);
        }
        
        .video-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
        }
        
        .video-indicator::before {
            content: '▶';
            margin-right: 5px;
            font-size: 0.8rem;
        }
        
        .research-content {
            padding: 1.5rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        
        .research-title {
            margin-bottom: 0.8rem;
            font-size: 1.3rem;
            color: var(--primary-color);
        }
        
        .research-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
            color: #666;
            font-size: 0.9rem;
        }
        
        .research-meta .date {
            display: flex;
            align-items: center;
        }
        
        .research-meta .date::before {
            content: '📅';
            margin-right: 5px;
        }
        
        .research-description {
            color: #555;
            margin-bottom: 1.5rem;
            flex-grow: 1;
            line-height: 1.5;
        }
        
        .btn {
            align-self: flex-start;
            padding: 0.6rem 1.2rem;
            background-color: var(--primary-color);
            color: white;
            border-radius: 4px;
            text-decoration: none;
            transition: background-color 0.3s;
            font-weight: 500;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .btn:hover {
            background-color: var(--secondary-color);
        }
        
        .research-header {
            text-align: center;
            margin-bottom: 3rem;
        }
        
        .research-header p {
            font-size: 1.2rem;
            max-width: 700px;
            margin: 0 auto;
            color: #555;
        }
        
        @media (max-width: 768px) {
            .research-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- 页眉容器 - 将通过组件系统动态加载 -->
    <div id="header-container"></div>

    <main>
        <section class="hero">
            <div class="container">
                <h1>科研动态</h1>
                <p>科研成果可视化-成果不仅仅停留在论文上</p>
            </div>
        </section>

        <section class="research-updates">
            <div class="container">
                <div class="research-header">
                    <h2>创新研究成果展示</h2>
                    <p>信息安全实验室致力于智能网联与信息安全领域的前沿研究，展示我们最新的技术突破与实际应用成果</p>
                </div>
                
                <div id="research-grid" class="research-grid">
                    <!-- 内容将通过配置文件动态加载 -->
                </div>
            </div>
        </section>
    </main>

    <!-- 页脚容器 - 将通过组件系统动态加载 -->
    <div id="footer-container"></div>

    <!-- 加载组件系统 -->
    <script src="../../components/component-loader.js"></script>
    <script src="../../js/components.js"></script>
    <script src="../../js/config-manager.js"></script>
    <script src="../../js/content-renderer.js"></script>
    <script src="../../js/main.js"></script>
    
    <script>
        // 页面加载完成后初始化内容
        document.addEventListener('DOMContentLoaded', function() {
            // 等待组件加载完成后再加载内容
            setTimeout(() => {
                initPageContent('research');
            }, 100);
        });
    </script>
</body>
</html>
