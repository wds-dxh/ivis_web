<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科研动态 - 信息安全实验室 (ivis)</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/navigation.css">
    <link rel="stylesheet" href="../../css/modules.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <style>
        .research-header {
            text-align: center;
            margin-bottom: 3rem;
        }
        
        .research-header p {
            font-size: 1.2rem;
            max-width: 700px;
            margin: 0 auto;
            color: #555;
        }
        
        .video-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
        }
        
        .video-indicator::before {
            content: '▶';
            margin-right: 5px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <!-- 页眉容器 - 将通过组件系统动态加载 -->
    <div id="header-container"></div>

    <main>
        <section class="hero">
            <div class="container">
                <h1>科研动态</h1>
                <p>科研成果可视化-成果不仅仅停留在论文上</p>
            </div>
        </section>

        <section class="research-updates">
            <div class="container">
                <div class="research-header">
                    <h2>创新研究成果展示</h2>
                    <p>信息安全实验室致力于智能网联与信息安全领域的前沿研究，展示我们最新的技术突破与实际应用成果</p>
                </div>
                
                <div id="research-grid" class="research-grid">
                    <!-- 内容将通过配置文件动态加载 -->
                </div>
            </div>
        </section>
    </main>

    <!-- 页脚容器 - 将通过组件系统动态加载 -->
    <div id="footer-container"></div>

    <!-- 加载组件系统 -->
    <script src="../../components/component-loader.js"></script>
    <script src="../../js/components.js"></script>
    <script src="../../js/config-manager.js"></script>
    <script src="../../js/content-renderer.js"></script>
    <script src="../../js/main.js"></script>
    
    <script>
        // 页面加载完成后初始化内容
        document.addEventListener('DOMContentLoaded', function() {
            // 等待组件加载完成后再加载内容
            setTimeout(() => {
                initPageContent('research');
            }, 100);
        });
    </script>
</body>
</html>
