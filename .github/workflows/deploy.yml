name: 自动部署到服务器

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v3
      
    - name: 设置 Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        
    - name: 安装依赖
      run: |
        if [ -f package.json ]; then
          npm ci
        else
          echo "无需安装依赖，使用纯前端项目"
        fi
        
    - name: 构建项目
      run: |
        if [ -f scripts/build.js ]; then
          node scripts/build.js
        else
          echo "跳过构建步骤"
          mkdir -p dist
          cp -r . dist/
          rm -rf dist/.git dist/.github dist/node_modules dist/scripts
        fi
        
    - name: 验证构建结果
      run: |
        echo "构建文件列表："
        find dist -type f -name "*.html" -o -name "*.css" -o -name "*.js" | head -20
        
    - name: 部署到服务器 (SSH)
      if: github.ref == 'refs/heads/main'
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.PRIVATE_KEY }}
        port: ${{ secrets.PORT }}
        script: |
          # 创建备份
          if [ -d "/var/www/html/backup" ]; then
            rm -rf /var/www/html/backup
          fi
          if [ -d "/var/www/html" ]; then
            cp -r /var/www/html /var/www/html/backup
          fi
          
          # 清理目标目录
          rm -rf /var/www/html/*
          
          echo "服务器准备完成，等待文件传输..."
          
    - name: 传输文件到服务器
      if: github.ref == 'refs/heads/main'
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.PRIVATE_KEY }}
        port: ${{ secrets.PORT }}
        source: "dist/*"
        target: "/var/www/html"
        strip_components: 1
        
    - name: 设置文件权限
      if: github.ref == 'refs/heads/main'
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.PRIVATE_KEY }}
        port: ${{ secrets.PORT }}
        script: |
          # 设置正确的文件权限
          chown -R www-data:www-data /var/www/html
          find /var/www/html -type d -exec chmod 755 {} \;
          find /var/www/html -type f -exec chmod 644 {} \;
          
          # 重启Web服务器 (可选)
          # systemctl reload nginx
          
          echo "部署完成！"
          
    - name: 健康检查
      if: github.ref == 'refs/heads/main'
      run: |
        echo "等待服务器响应..."
        sleep 10
        
        # 检查网站是否可访问 (需要配置 SITE_URL secret)
        if [ -n "${{ secrets.SITE_URL }}" ]; then
          curl -f ${{ secrets.SITE_URL }} || echo "网站健康检查失败"
        fi
        
    - name: 通知部署结果
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: |
          项目部署${{ job.status == 'success' && '成功' || '失败' }}！
          分支: ${{ github.ref }}
          提交: ${{ github.sha }}
          作者: ${{ github.actor }}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      continue-on-error: true

  # 预览部署 (PR时触发)
  preview-deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v3
      
    - name: 构建预览版本
      run: |
        mkdir -p preview
        cp -r . preview/
        rm -rf preview/.git preview/.github preview/node_modules
        
    - name: 部署到预览环境
      run: |
        echo "预览环境部署逻辑"
        echo "可以集成 Netlify、Vercel 等服务"
        echo "PR #${{ github.event.number }} 的预览链接将在这里生成"